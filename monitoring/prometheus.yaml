global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: bankflow
    static_configs:
      - targets: ['backend:8000']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: probe-exporter
    static_configs:
      - targets: ['probe:9115']
  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://frontend/health','http://backend:8000/health','http://model:5001/ping','http://mlflow:5000/health','http://grafana:3000/api/health']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: probe:9115
